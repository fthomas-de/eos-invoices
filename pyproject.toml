[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "eos_invoices"
dynamic = ["version", "description"]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Flo", email = "xxxeoeoxxx@gmail.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # 5.1.4: first release with eveonline migration 0025, which ours depend
    # on. Everything the templates use - the datatables-2 bundles, the
    # DataTables translations, framework/header/page-header.html - ships
    # with it. (bundles/filterdropdown-js.html changed its plugin in 5.3.0;
    # the log no longer uses it, its filter runs on the server.)
    "allianceauth>=5.1.4",
    # imported directly (solo.models, solo.admin), not only through AA
    "django-solo",
]

[project.optional-dependencies]
# tools/translate.py needs polib; tox and coverage run the suite standalone
dev = [
    "coverage",
    "polib",
    "tox",
]

[project.urls]
Homepage = "https://github.com/fthomas-de/eos-invoices"
Source = "https://github.com/fthomas-de/eos-invoices"
Changelog = "https://github.com/fthomas-de/eos-invoices/blob/master/CHANGELOG.md"
Tracker = "https://github.com/fthomas-de/eos-invoices/issues"

[tool.flit.module]
name = "eos_invoices"

[tool.isort]
profile = "black"
multi_line_output = 3
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DJANGO",
    "ALLIANCEAUTH",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
known_allianceauth = ["allianceauth", "app_utils"]
known_django = ["django", "solo"]

[tool.pylint.'MASTER']
ignore-patterns = ["test_.*.py,__init__.py", "generate_.*.py"]
ignore-paths = ["^.*//migrations//.*$"]

[tool.pylint.'BASIC']
good-names = ["i", "j", "k", "x", "f", "ex"]

[tool.pylint.'FORMAT']
max-line-length = 120

[tool.pylint.'MESSAGES CONTROL']
disable = ["E0213", "E1101", "C0209", "C"]
